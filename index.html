<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Themed Runner – 6 Levels</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      width: 100%;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.7);
      border-radius: 10px;
      overflow: hidden;
      max-width: 100vw;
      touch-action: none;
    }
    canvas {
      display: block;
      background: #1a1a1a;
      width: 100%;
      max-width: 100vw;
      max-height: 70dvh;
      image-rendering: pixelated;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      font-size: 16px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      z-index: 10;
      gap: 12px;
    }
    #ui-left { display: flex; flex-direction: column; gap: 4px; }
    #level-name { font-weight: 700; letter-spacing: 0.4px; font-size: 17px; }
    #lives { font-size: 15px; letter-spacing: 1px; }
    #score { font-variant-numeric: tabular-nums; font-size: 17px; text-align: right; }
    #power-status {
      position: absolute;
      top: 52px;
      left: 14px;
      font-size: 13px;
      color: #fbbf24;
      text-shadow: 0 1px 3px #000;
      z-index: 10;
      pointer-events: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: auto;
      overscroll-behavior: contain;
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    #overlay h2 {
      font-size: 1.3rem;
      margin: 12px 0 8px;
      opacity: 0.9;
    }
    #overlay p {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 16px;
      max-width: 440px;
      line-height: 1.4;
    }
    .btn {
      background: #fff;
      color: #111;
      border: none;
      padding: 11px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover { transform: scale(1.05); background: #f0f0f0; }
    .btn.secondary {
      background: transparent;
      color: #fff;
      border: 2px solid #fff;
    }
    .btn.secondary:hover { background: rgba(255,255,255,0.12); }
    .btn.small { padding: 8px 16px; font-size: 0.9rem; }
    .login-form {
      width: 100%;
      max-width: 340px;
      text-align: left;
      margin: 12px 0 8px;
    }
    .login-form label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      opacity: 0.85;
    }
    .login-form input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px; /* critical: prevents iOS auto-zoom on focus */
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    .login-form input:focus {
      border-color: #60a5fa;
    }
    .login-form input.error {
      border-color: #ef4444;
    }
    .form-error {
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 10px;
      min-height: 1.2em;
    }
    #player-greeting {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 6px;
    }
    #level-select, #char-select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0;
      max-width: 480px;
    }
    .level-btn, .char-btn {
      background: #2a2a2a;
      color: #fff;
      border: 2px solid #444;
      padding: 12px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .level-btn:hover:not(:disabled), .char-btn:hover:not(:disabled) {
      border-color: #fff;
      background: #3a3a3a;
    }
    .level-btn:disabled, .char-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .level-btn.unlocked { border-color: #4ade80; }
    .level-btn.current { border-color: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.35); }
    .char-btn.selected { border-color: #60a5fa; box-shadow: 0 0 10px rgba(96,165,250,0.4); }
    .char-btn .char-preview {
      width: 36px; height: 40px;
      margin: 0 auto 6px;
      image-rendering: pixelated;
    }
    #highscores {
      margin-top: 8px;
      font-size: 0.85rem;
      opacity: 0.85;
      max-width: 420px;
      text-align: left;
      background: rgba(255,255,255,0.06);
      padding: 10px 14px;
      border-radius: 8px;
    }
    #highscores table { width: 100%; border-collapse: collapse; }
    #highscores td { padding: 3px 6px; }
    #highscores td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    #instructions {
      margin-top: 14px;
      font-size: 0.85rem;
      opacity: 0.7;
      line-height: 1.5;
    }
    #mobile-controls {
      display: none;
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      z-index: 15;
      pointer-events: none;
    }
    .control-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      border: 3px solid rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .control-btn:active {
      background: rgba(255,255,255,0.4);
      transform: scale(0.92);
    }
    @media (max-width: 900px), (pointer: coarse) {
      #mobile-controls { display: block; }
      #ui { font-size: 13px; top: 8px; left: 10px; right: 10px; }
      #overlay { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      #overlay h1 { font-size: 1.6rem; }
      #level-select, #char-select { grid-template-columns: repeat(2, 1fr); max-width: 100%; }
      .login-form { max-width: 100%; }
      .login-form input { font-size: 16px; padding: 14px; } /* prevents iOS zoom */
      .btn { padding: 14px 22px; font-size: 1rem; min-height: 48px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      canvas { max-height: 85dvh; }
      #mobile-controls { bottom: 8px; right: 12px; }
      .control-btn { width: 64px; height: 64px; font-size: 26px; }
      #overlay h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="ui">
      <div id="ui-left">
        <div id="level-name">Desert Dino</div>
        <div id="lives">♥ ♥ ♥</div>
      </div>
      <div id="score">0</div>
    </div>
    <div id="power-status"></div>
    <div id="mobile-controls">
      <div class="control-btn" id="btn-jump">▲</div>
    </div>
    <div id="overlay"></div>
  </div>

      { id: "shield", name: "Shield", color: "#60a5fa", duration: 300, chance: 0.35 },

    // ============================================================
    // STATE
    // ============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const levelNameEl = document.getElementById("level-name");

    const livesEl = document.getElementById("lives");

    let currentLevel = 0;
    let selectedChar = 0;
    let unlockedLevels = [true, false, false, false, false, false];
    let unlockedChars = [true, false, false, false];

    let playerInfo = { name: "", email: "", mobile: "" };

    let gameState = "login";
    let score = 0;
    let lives = 3;
    let frame = 0;
    let speed = 5;
    let spawnTimer = 0;
    let powerSpawnTimer = 180;
    let obstacles = [];
    let powerups = [];
    let particles = [];
    let bgOffset = 0;

    // Active power-ups
    let shieldTimer = 0;
    let slowmoTimer = 0;
    let extraJumpTimer = 0;
    let invulnTimer = 0; // after hit
    let canDoubleJump = false;

    const player = {
      x: 90, y: 0, w: 36, h: 48,
      vy: 0, grounded: true, ducking: false, dead: false,
      runFrame: 0, jumpHoldTime: 0
    };

    const MAX_LIVES = 3;

    // ============================================================
    // PERSISTENCE
    // ============================================================
    function loadSave() {
      try {
        const s = JSON.parse(localStorage.getItem("themedRunnerSave") || "{}");
        if (s.unlockedLevels) unlockedLevels = s.unlockedLevels;
        if (s.unlockedChars) unlockedChars = s.unlockedChars;
        if (s.highScores) highScores = s.highScores;
        if (s.bestOverall) bestOverall = s.bestOverall;
        if (typeof s.selectedChar === "number") selectedChar = s.selectedChar;
        if (s.playerInfo) playerInfo = s.playerInfo;
      } catch (e) {}
    }
    function save() {
      try {
        localStorage.setItem("themedRunnerSave", JSON.stringify({
          unlockedLevels, unlockedChars, highScores, bestOverall, selectedChar, playerInfo
        }));
      } catch (e) {}
    }
    loadSave();

    // ============================================================
    // INPUT
    // ============================================================
    let keys = {};
    let jumpPressed = false;
    let jumpBuffered = false;

    window.addEventListener("keydown", e => {
      // Only capture game keys while playing — never block typing on login form
      if (gameState !== "playing") return;

      keys[e.code] = true;
      if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
        e.preventDefault();
        jumpPressed = true;
        jumpBuffered = true;
      }
    });
    window.addEventListener("keyup", e => {
      if (gameState !== "playing") return;
      keys[e.code] = false;
      if (["Space", "ArrowUp", "KeyW"].includes(e.code)) jumpPressed = false;
    });
    function onJumpStart(e) {
      if (e && e.cancelable) e.preventDefault();
      if (gameState === "playing") {
        jumpPressed = true;
        jumpBuffered = true;
      }
    }
    function onJumpEnd(e) {
      if (e && e.cancelable) e.preventDefault();
      jumpPressed = false;
    }

    // Canvas tap / hold to jump
    canvas.addEventListener("pointerdown", onJumpStart, { passive: false });
    canvas.addEventListener("pointerup", onJumpEnd, { passive: false });
    canvas.addEventListener("pointercancel", onJumpEnd, { passive: false });
    canvas.addEventListener("touchstart", onJumpStart, { passive: false });
    canvas.addEventListener("touchend", onJumpEnd, { passive: false });

    const btnJump = document.getElementById("btn-jump");
    if (btnJump) {
      btnJump.addEventListener("pointerdown", onJumpStart, { passive: false });
      btnJump.addEventListener("pointerup", onJumpEnd, { passive: false });
      btnJump.addEventListener("pointerleave", onJumpEnd, { passive: false });
      btnJump.addEventListener("pointercancel", onJumpEnd, { passive: false });
      btnJump.addEventListener("touchstart", onJumpStart, { passive: false });
      btnJump.addEventListener("touchend", onJumpEnd, { passive: false });
    }

    // Prevent page scroll / bounce while interacting with game
    document.addEventListener("touchmove", e => {
      if (gameState === "playing") e.preventDefault();
    }, { passive: false });

    // ============================================================
    // UI HELPERS
    // ============================================================
    function heartsString(n) {
      return "♥ ".repeat(n).trim() + (n < MAX_LIVES ? " ♡".repeat(MAX_LIVES - n) : "");
    }

    function updatePowerStatus() {
      const parts = [];
      if (shieldTimer > 0) parts.push(`🛡 Shield ${Math.ceil(shieldTimer / 60)}s`);
      if (slowmoTimer > 0) parts.push(`⏱ Slow-Mo ${Math.ceil(slowmoTimer / 60)}s`);
      if (extraJumpTimer > 0) parts.push(`⬆ Extra Jump ${Math.ceil(extraJumpTimer / 60)}s`);
      powerStatusEl.textContent = parts.join("  ·  ");
    }

    function buildHighScoreTable() {
      let html = "<table>";
      LEVELS.forEach((l, i) => {
        html += `<tr><td>${l.name}</td><td>${highScores[i] || "—"}</td></tr>`;
      });
      html += `<tr style="font-weight:700"><td>Best Overall</td><td>${bestOverall || "—"}</td></tr>`;
      html += "</table>";
      return html;
    }

    // ============================================================
    // MENUS
    // ============================================================
    function showLogin() {
      gameState = "login";
      overlay.classList.remove("hidden");
      overlay.innerHTML = `
        <h1>Themed Runner</h1>
        <p>Enter your details to start</p>
        <div class="login-form">
          <label for="inp-name">Full Name</label>
          <input type="text" id="inp-name" placeholder="Your name" maxlength="40" autocomplete="name" value="${playerInfo.name || ""}" />
          <label for="inp-email">Email</label>
          <input type="email" id="inp-email" placeholder="you@example.com" maxlength="60" autocomplete="email" value="${playerInfo.email || ""}" />
          <label for="inp-mobile">Mobile Number</label>
          <input type="tel" id="inp-mobile" placeholder="e.g. 05XXXXXXXX" maxlength="15" autocomplete="tel" value="${playerInfo.mobile || ""}" />
          <div class="form-error" id="form-error"></div>
        </div>
        <button class="btn" id="btn-login">Continue</button>
      `;
      document.getElementById("btn-login").onclick = handleLogin;
      // Allow Enter key
      ["inp-name", "inp-email", "inp-mobile"].forEach(id => {
        document.getElementById(id).addEventListener("keydown", e => {
          if (e.key === "Enter") handleLogin();
        });
      });
    }

    function handleLogin() {
      const name = document.getElementById("inp-name").value.trim();
      const email = document.getElementById("inp-email").value.trim();
      const mobile = document.getElementById("inp-mobile").value.trim();
      const errEl = document.getElementById("form-error");

      // reset error styles
      ["inp-name", "inp-email", "inp-mobile"].forEach(id => {
        document.getElementById(id).classList.remove("error");
      });

      if (!name) {
        errEl.textContent = "Please enter your name.";
        document.getElementById("inp-name").classList.add("error");
        return;
      }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errEl.textContent = "Please enter a valid email address.";
        document.getElementById("inp-email").classList.add("error");
        return;
      }
      if (!mobile || mobile.replace(/\D/g, "").length < 8) {
        errEl.textContent = "Please enter a valid mobile number.";
        document.getElementById("inp-mobile").classList.add("error");
        return;
      }

      playerInfo = { name, email, mobile };
      save();

      // Send data to Google Sheet
      sendToGoogleSheet(name, email, mobile);

      showMenu();
    }

    function sendToGoogleSheet(name, email, mobile) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
        console.warn("Google Sheet URL not configured yet.");
        return;
      }

      const data = {
        name: name,
        email: email,
        mobile: mobile,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent
      };

      // Use no-cors so it works from file:// or any domain
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }).catch(err => {
        console.warn("Could not send to Google Sheet:", err);
      });
    }

    function showMenu() {
      gameState = "menu";
      overlay.classList.remove("hidden");
      const greeting = playerInfo.name
        ? `<div id="player-greeting">Welcome, <strong>${playerInfo.name}</strong></div>`
        : "";
      overlay.innerHTML = `
        <h1>Themed Runner</h1>
        ${greeting}
        <p>6 iconic buildings · Power-ups · Lives · Multiple characters</p>
        <button class="btn" id="btn-start">Play</button>
        <button class="btn secondary" id="btn-chars">Characters</button>
        <button class="btn secondary" id="btn-scores">High Scores</button>

    function buildLevelSelect() {
      const container = document.getElementById("level-select");

        btn.disabled = !unlockedLevels[i];

        btn.onclick = () => {

    function showCharacterSelect() {
      gameState = "chars";
      overlay.classList.remove("hidden");
      let html = `<h1>Characters</h1><p>Unlock more by completing levels</p><div id="char-select"></div>
        <button class="btn secondary" id="btn-back">Back</button>`;

          <canvas class="char-preview" width="36" height="40" data-id="${i}"></canvas>

      overlay.innerHTML = `

    // ============================================================
    // GAME FLOW
    // ============================================================
    function startLevel() {
      const lvl = LEVELS[currentLevel];
      const ch = CHARACTERS[selectedChar];
      gameState = "playing";
      overlay.classList.add("hidden");
      score = 0;
      lives = MAX_LIVES;
      frame = 0;
      speed = lvl.speed * ch.speedMod;
      spawnTimer = 70;
      powerSpawnTimer = 200 + Math.random() * 100;
      obstacles = [];
      powerups = [];
      particles = [];
      bgOffset = 0;
      shieldTimer = slowmoTimer = extraJumpTimer = invulnTimer = 0;
      canDoubleJump = false;
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.grounded = true;
      player.ducking = false;
      player.dead = false;
      player.h = 48;
      player.runFrame = 0;
      player.jumpHoldTime = 0;
      levelNameEl.textContent = lvl.name;
      scoreEl.textContent = "0 / " + lvl.target;
      livesEl.textContent = heartsString(lives);
      updatePowerStatus();
      update();
    }

    function onHit() {
      if (shieldTimer > 0 || invulnTimer > 0) return;
      lives--;
      livesEl.textContent = heartsString(lives);
      invulnTimer = 90; // 1.5s invuln
      // particles
      const ch = CHARACTERS[selectedChar];
      for (let i = 0; i < 14; i++) {
        particles.push({
          x: player.x + player.w / 2,
          y: player.y + player.h / 2,
          vx: (Math.random() - 0.5) * 9,
          vy: (Math.random() - 0.5) * 9 - 2,
          life: 25 + Math.random() * 15,
          color: ch.accent
        });
      }
      if (lives <= 0) {
        gameOver();
      }
    }

    function levelComplete() {
      gameState = "levelComplete";
      const finalScore = Math.floor(score);
      if (finalScore > highScores[currentLevel]) highScores[currentLevel] = finalScore;
      if (finalScore > bestOverall) bestOverall = finalScore;

      // unlock next level
      if (currentLevel < 5) unlockedLevels[currentLevel + 1] = true;
      // unlock characters
      CHARACTERS.forEach((c, i) => {
        if (currentLevel >= c.unlockLevel) unlockedChars[i] = true;
      });
      save();

      const isLast = currentLevel === 5;
      overlay.classList.remove("hidden");
      overlay.innerHTML = `
        <h1>${isLast ? "ALL WORLDS CLEARED!" : "Level Complete!"}</h1>
        <p>Score: ${finalScore}${finalScore >= highScores[currentLevel] ? " · New best!" : ""}</p>
        ${isLast
          ? `<button class="btn" id="btn-restart">Play Again</button>`
          : `<button class="btn" id="btn-next">Next Level →</button>`}
        <button class="btn secondary" id="btn-menu">Menu</button>
      `;
      if (isLast) {
        document.getElementById("btn-restart").onclick = () => { currentLevel = 0; startLevel(); };
      } else {
        document.getElementById("btn-next").onclick = () => { currentLevel++; startLevel(); };
      }
      document.getElementById("btn-menu").onclick = showMenu;
    }

    function gameOver() {
      gameState = "gameOver";
      const finalScore = Math.floor(score);
      if (finalScore > highScores[currentLevel]) highScores[currentLevel] = finalScore;
      if (finalScore > bestOverall) bestOverall = finalScore;
      save();
      overlay.classList.remove("hidden");
      overlay.innerHTML = `
        <h1>Game Over</h1>
        <p>${LEVELS[currentLevel].name}<br>Score: ${finalScore}</p>
        <div id="highscores" style="margin-bottom:12px">${buildHighScoreTable()}</div>
        <button class="btn" id="btn-retry">Retry</button>
        <button class="btn secondary" id="btn-menu">Menu</button>
      `;
      document.getElementById("btn-retry").onclick = () => startLevel();
      document.getElementById("btn-menu").onclick = showMenu;
    }

    // ============================================================
    // PIXEL-ART DRAWING HELPERS
    // ============================================================
    function drawPixelPlayer(ctx, x, y, w, h, char, runFrame, ducking, invuln, inAir) {
      if (invuln && Math.floor(frame / 4) % 2 === 0) return; // blink

      const s = w / 36;
      const belly = char.belly || "#fef3c7";
      ctx.save();

      if (ducking) {
        // === DUCK / SLIDE (inspired by the preferred teal T-Rex) ===
        // Main body low & elongated
        ctx.fillStyle = char.color;
        ctx.fillRect(x + 1 * s, y + 8 * s, 30 * s, 16 * s);
        // Head forward
        ctx.fillRect(x + 22 * s, y + 2 * s, 14 * s, 14 * s);
        // Snout
        ctx.fillRect(x + 32 * s, y + 6 * s, 7 * s, 8 * s);
        // Belly strip
        ctx.fillStyle = belly;
        ctx.fillRect(x + 4 * s, y + 14 * s, 22 * s, 8 * s);
        // Eye
        ctx.fillStyle = char.eye;
        ctx.fillRect(x + 28 * s, y + 5 * s, 5 * s, 5 * s);
        ctx.fillStyle = "#111";
        ctx.fillRect(x + 30 * s, y + 6 * s, 3 * s, 3 * s);
        // Tucked legs
        ctx.fillStyle = char.accent;
        ctx.fillRect(x + 6 * s, y + 22 * s, 9 * s, 5 * s);
        ctx.fillRect(x + 18 * s, y + 22 * s, 9 * s, 5 * s);
        // Small arm
        ctx.fillStyle = char.color;
        ctx.fillRect(x + 3 * s, y + 11 * s, 6 * s, 5 * s);
        // Dust
        if (Math.floor(frame / 3) % 2 === 0) {
          ctx.fillStyle = "rgba(160,140,100,0.55)";
          ctx.fillRect(x - 5 * s, y + 24 * s, 5 * s, 3 * s);
          ctx.fillRect(x + 1 * s, y + 25 * s, 4 * s, 2 * s);
        }
      } else if (inAir) {
        // === JUMP POSE ===
        // Body slightly upright
        ctx.fillStyle = char.color;
        ctx.fillRect(x + 6 * s, y + 6 * s, 24 * s, 26 * s);
        // Head
        ctx.fillRect(x + 16 * s, y - 2 * s, 16 * s, 14 * s);
        // Snout
        ctx.fillRect(x + 28 * s, y + 4 * s, 8 * s, 8 * s);
        // Belly
        ctx.fillStyle = belly;
        ctx.fillRect(x + 10 * s, y + 14 * s, 16 * s, 14 * s);
        // Eye
        ctx.fillStyle = char.eye;
        ctx.fillRect(x + 24 * s, y + 2 * s, 5 * s, 5 * s);
        ctx.fillStyle = "#111";
        ctx.fillRect(x + 26 * s, y + 3 * s, 3 * s, 3 * s);
        // Legs tucked / kicking
        ctx.fillStyle = char.accent;
        ctx.fillRect(x + 8 * s, y + 28 * s, 8 * s, 12 * s);
        ctx.fillRect(x + 20 * s, y + 30 * s, 8 * s, 10 * s);
        // Arms out
        ctx.fillStyle = char.color;
        ctx.fillRect(x + 2 * s, y + 12 * s, 7 * s, 6 * s);
        ctx.fillRect(x + 28 * s, y + 14 * s, 6 * s, 5 * s);
        // Tail
        ctx.fillStyle = char.color;
        ctx.fillRect(x - 2 * s, y + 18 * s, 10 * s, 6 * s);
      } else {
        // === RUN / STAND POSE ===
        ctx.fillStyle = char.color;
        // Body
        ctx.fillRect(x + 5 * s, y + 8 * s, 26 * s, 26 * s);
        // Head
        ctx.fillRect(x + 16 * s, y, 16 * s, 14 * s);
        // Snout
        ctx.fillRect(x + 28 * s, y + 5 * s, 8 * s, 8 * s);
        // Belly
        ctx.fillStyle = belly;
        ctx.fillRect(x + 9 * s, y + 16 * s, 18 * s, 14 * s);
        // Eye
        ctx.fillStyle = char.eye;
        ctx.fillRect(x + 24 * s, y + 4 * s, 5 * s, 5 * s);
        ctx.fillStyle = "#111";
        ctx.fillRect(x + 26 * s, y + 5 * s, 3 * s, 3 * s);
        // Legs with run cycle
        const legOff = Math.sin(runFrame) * 6 * s;
        ctx.fillStyle = char.accent;
        ctx.fillRect(x + 8 * s, y + 32 * s, 8 * s, 12 * s + legOff);
        ctx.fillRect(x + 20 * s, y + 32 * s, 8 * s, 12 * s - legOff);
        // Arm
        ctx.fillStyle = char.color;
        ctx.fillRect(x + 2 * s, y + 14 * s, 6 * s, 9 * s);
        // Tail
        ctx.fillRect(x - 1 * s, y + 20 * s, 9 * s, 6 * s);
      }

      ctx.restore();
    }

    function drawPixelObstacle(ctx, o) {
      const x = o.x, y = o.y, w = o.w, h = o.h;
      ctx.fillStyle = o.color;

      switch (o.type) {
        case "cactus":
        case "tallCactus":
          // trunk
          ctx.fillRect(x + w * 0.3, y, w * 0.4, h);
          // arms
          ctx.fillRect(x, y + h * 0.25, w * 0.35, h * 0.18);
          ctx.fillRect(x + w * 0.65, y + h * 0.45, w * 0.35, h * 0.18);
          // spikes
          ctx.fillStyle = "#1a5c2e";
          for (let i = 0; i < 4; i++) {
            ctx.fillRect(x + w * 0.35, y + 8 + i * (h / 5), 3, 4);
            ctx.fillRect(x + w * 0.55, y + 12 + i * (h / 5), 3, 4);
          }
          break;
        case "rock":
          ctx.beginPath();
          ctx.moveTo(x + w * 0.2, y + h);
          ctx.lineTo(x, y + h * 0.5);
          ctx.lineTo(x + w * 0.3, y);
          ctx.lineTo(x + w * 0.7, y + h * 0.15);
          ctx.lineTo(x + w, y + h * 0.55);
          ctx.lineTo(x + w * 0.8, y + h);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(0,0,0,0.2)";
          ctx.fillRect(x + w * 0.4, y + h * 0.3, w * 0.3, h * 0.25);
          break;
        case "root":
          ctx.fillRect(x, y + h * 0.4, w, h * 0.6);
          ctx.fillRect(x + w * 0.15, y, w * 0.25, h * 0.5);
          ctx.fillRect(x + w * 0.55, y + h * 0.15, w * 0.3, h * 0.4);
          break;
        case "coconut":
          ctx.beginPath();
          ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#5d4037";
          ctx.fillRect(x + w * 0.3, y + h * 0.2, 3, 4);
          ctx.fillRect(x + w * 0.55, y + h * 0.35, 3, 4);
          break;
        case "snake":
          ctx.fillRect(x, y + h * 0.3, w * 0.7, h * 0.5);
          ctx.fillRect(x + w * 0.55, y, w * 0.45, h);
          // tongue
          ctx.fillStyle = "#e74c3c";
          ctx.fillRect(x + w * 0.9, y + h * 0.4, 8, 3);
          break;
        case "stump":
          ctx.fillRect(x + 4, y, w - 8, h);
          ctx.fillStyle = "#3e2723";
          ctx.fillRect(x, y, w, 8);
          ctx.fillRect(x + 6, y + 12, w - 12, 4);
          ctx.fillRect(x + 6, y + 22, w - 12, 4);
          break;
        case "iceSpike":
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y);
          ctx.lineTo(x + w, y + h);
          ctx.lineTo(x, y + h);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.4)";
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y + 4);
          ctx.lineTo(x + w * 0.7, y + h * 0.6);
          ctx.lineTo(x + w * 0.35, y + h * 0.6);
          ctx.closePath();
          ctx.fill();
          break;
        case "snowball":
          ctx.beginPath();
          ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(0,0,0,0.1)";
          ctx.beginPath();
          ctx.arc(x + w * 0.35, y + h * 0.35, 3, 0, Math.PI * 2);
          ctx.arc(x + w * 0.6, y + h * 0.5, 2, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "iceBlock":
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = "rgba(255,255,255,0.35)";
          ctx.fillRect(x + 4, y + 4, w * 0.4, 6);
          ctx.fillRect(x + 4, y + 14, 6, h * 0.4);
          break;
        case "penguin":
          // body
          ctx.fillStyle = "#2c3e50";
          ctx.fillRect(x + 4, y + 8, w - 8, h - 8);
          // belly
          ctx.fillStyle = "#ecf0f1";
          ctx.fillRect(x + 8, y + 16, w - 16, h - 22);
          // head
          ctx.fillStyle = "#2c3e50";
          ctx.fillRect(x + 6, y, w - 12, 14);
          // eye
          ctx.fillStyle = "#fff";
          ctx.fillRect(x + w - 14, y + 4, 5, 5);
          ctx.fillStyle = "#111";
          ctx.fillRect(x + w - 12, y + 5, 3, 3);
          // beak
          ctx.fillStyle = "#f39c12";
          ctx.fillRect(x + w - 8, y + 8, 8, 4);
          break;
        case "cone":
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y);
          ctx.lineTo(x + w, y + h);
          ctx.lineTo(x, y + h);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.fillRect(x + 5, y + h * 0.35, w - 10, 5);
          ctx.fillRect(x + 7, y + h * 0.55, w - 14, 5);
          break;
        case "drone":
          ctx.fillStyle = o.color;
          ctx.fillRect(x + 4, y + 6, w - 8, 10);
          // props
          ctx.fillRect(x, y, 10, 6);
          ctx.fillRect(x + w - 10, y, 10, 6);
          // light
          ctx.fillStyle = "#ff0";
          ctx.fillRect(x + w / 2 - 3, y + 8, 6, 4);
          break;
        case "barrier":
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = "#fff";
          for (let i = 0; i < 3; i++) {
            ctx.fillRect(x + 6 + i * 16, y + 6, 10, h - 12);
          }
          break;
        case "sign":
          ctx.fillRect(x + w / 2 - 3, y, 6, h);
          ctx.fillStyle = "#e74c3c";
          ctx.fillRect(x, y, w, 18);
          ctx.fillStyle = "#fff";
          ctx.fillRect(x + 4, y + 5, w - 8, 8);
          break;
        case "lavaPool":
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = "#f39c12";
          ctx.fillRect(x + 4, y + 3, w - 8, 5);
          ctx.fillStyle = "#fff3";
          ctx.fillRect(x + 10, y + 4, 8, 3);
          break;
        case "rockFall":
        case "asteroid":
          ctx.beginPath();
          ctx.moveTo(x + w * 0.3, y);
          ctx.lineTo(x + w, y + h * 0.3);
          ctx.lineTo(x + w * 0.8, y + h);
          ctx.lineTo(x, y + h * 0.7);
          ctx.closePath();
          ctx.fill();
          break;
        case "geyser":
          ctx.fillRect(x + 6, y + h * 0.4, w - 12, h * 0.6);
          ctx.fillStyle = "#e74c3c";
          ctx.fillRect(x, y, w, h * 0.45);
          ctx.fillStyle = "#f39c12";
          ctx.fillRect(x + 8, y + 4, w - 16, 8);
          break;
        case "ember":
          ctx.beginPath();
          ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "crystal":
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y);
          ctx.lineTo(x + w, y + h * 0.55);
          ctx.lineTo(x + w * 0.7, y + h);
          ctx.lineTo(x + w * 0.3, y + h);
          ctx.lineTo(x, y + h * 0.55);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.3)";
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y + 4);
          ctx.lineTo(x + w * 0.65, y + h * 0.4);
          ctx.lineTo(x + w * 0.4, y + h * 0.4);
          ctx.closePath();
          ctx.fill();
          break;
        case "laser":
          ctx.shadowColor = o.color;
          ctx.shadowBlur = 14;
          ctx.fillRect(x, y, w, h);
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#fff";
          ctx.fillRect(x, y + 2, w, 4);
          break;
        case "plant":
          ctx.fillRect(x + w * 0.35, y + h * 0.3, w * 0.3, h * 0.7);
          // leaves
          ctx.beginPath();
          ctx.ellipse(x + w * 0.25, y + h * 0.35, w * 0.3, h * 0.2, -0.5, 0, Math.PI * 2);
          ctx.ellipse(x + w * 0.75, y + h * 0.3, w * 0.3, h * 0.22, 0.5, 0, Math.PI * 2);
          ctx.fill();
          break;
        default:
          ctx.fillRect(x, y, w, h);
      }
    }

    function drawPowerup(p) {
      const pulse = 1 + Math.sin(frame * 0.15) * 0.12;
      const r = 12 * pulse;
      ctx.save();
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.45, 0, Math.PI * 2);
      ctx.fill();
      // icon hint
      ctx.fillStyle = "#111";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const icon = p.id === "shield" ? "S" : p.id === "slowmo" ? "T" : "J";
      ctx.fillText(icon, p.x, p.y);
      ctx.restore();
    }

    // ============================================================
    // PLAYER UPDATE
    // ============================================================
    function updatePlayer() {
      const lvl = LEVELS[currentLevel];
      const ch = CHARACTERS[selectedChar];

      // Keep height fixed (no duck)
      player.ducking = false;
      player.h = 48;

      // === VARIABLE JUMP (hold longer = higher) + double jump ===
      if (jumpBuffered) {
        if (player.grounded) {
          player.vy = ch.jumpForce * 0.72;
          player.grounded = false;
          canDoubleJump = extraJumpTimer > 0;
          jumpBuffered = false;
          player.jumpHoldTime = 0;
          spawnJumpParticles();
        } else if (canDoubleJump && !player.grounded) {
          player.vy = ch.jumpForce * 0.80;
          canDoubleJump = false;
          jumpBuffered = false;
          player.jumpHoldTime = 0;
          spawnJumpParticles();
        }
      }

      // While holding jump button and still rising → continue boosting (variable height)
      if (jumpPressed && !player.grounded && player.vy < 0) {
        player.jumpHoldTime = (player.jumpHoldTime || 0) + 1;
        // Allow boost for first ~12-14 frames of hold
        if (player.jumpHoldTime < 14) {
          player.vy += ch.jumpForce * 0.045; // extra upward force while held
        }
      }

      // Release early → cut the jump short (fall faster)
      if (!jumpPressed && !player.grounded && player.vy < -2) {
        player.vy *= 0.55;
      }

      // physics
      const grav = lvl.gravity * ch.gravityMod;
      player.vy += grav * (slowmoTimer > 0 ? 0.55 : 1);
      player.y += player.vy * (slowmoTimer > 0 ? 0.55 : 1);

      if (player.y + player.h >= GROUND_Y) {
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.grounded = true;
        canDoubleJump = extraJumpTimer > 0;
        player.jumpHoldTime = 0;
      } else {
        player.grounded = false;
      }

      if (player.grounded) player.runFrame += 0.35 * (slowmoTimer > 0 ? 0.5 : 1);
    }

    function spawnJumpParticles() {
      const ch = CHARACTERS[selectedChar];
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: player.x + player.w / 2,
          y: GROUND_Y,
          vx: (Math.random() - 0.5) * 3,
          vy: -Math.random() * 2.5,
          life: 15 + Math.random() * 10,
          color: LEVELS[currentLevel].groundDetail
        });
      }
    }

    // ============================================================
    // OBSTACLES & POWERUPS
    // ============================================================
    function spawnObstacle() {
      const lvl = LEVELS[currentLevel];
      const t = lvl.obstacles[Math.floor(Math.random() * lvl.obstacles.length)];
      const obs = {
        ...t,
        x: canvas.width + 30,
        y: t.airborne ? GROUND_Y - 85 - Math.random() * 55 : GROUND_Y - t.h,
        passed: false
      };
      if (!t.airborne && Math.random() > 0.55) {
        obs.h = t.h * (0.85 + Math.random() * 0.3);
        obs.y = GROUND_Y - obs.h;
      }
      obstacles.push(obs);
    }

    function spawnPowerup() {
      const roll = Math.random();
      let acc = 0;
      let type = POWER_TYPES[0];
      for (const p of POWER_TYPES) {
        acc += p.chance;
        if (roll < acc) { type = p; break; }
      }
      powerups.push({
        id: type.id,
        name: type.name,
        color: type.color,
        duration: type.duration,
        x: canvas.width + 20,
        y: GROUND_Y - 70 - Math.random() * 50,
        r: 14
      });
    }

    function updateObstaclesAndPowerups() {
      const lvl = LEVELS[currentLevel];
      const ch = CHARACTERS[selectedChar];
      const slowFactor = slowmoTimer > 0 ? 0.45 : 1;
      speed = (lvl.speed * ch.speedMod + Math.min(score / 900, 3.5)) * slowFactor;

      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = Math.max(26, (48 + Math.random() * 38) / lvl.spawnRate - score / 1800);
      }

      powerSpawnTimer--;
      if (powerSpawnTimer <= 0) {
        spawnPowerup();
        powerSpawnTimer = 280 + Math.random() * 180;
      }

      // obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= speed;
        if (o.type === "drone" || o.type === "asteroid") {
          o.y += Math.sin(frame * 0.07 + o.x * 0.01) * 1.1;
        }
        if (o.type === "laser") {
          o.y = GROUND_Y - 75 + Math.sin(frame * 0.11) * 28;
        }
        if (!o.passed && o.x + o.w < player.x) {
          o.passed = true;
          score += 40;
        }
        if (o.x + o.w < -30) {
          obstacles.splice(i, 1);
          continue;
        }
        // collision (tighter with character scale)
        const scale = ch.hitboxScale;
        const pw = player.w * scale;
        const ph = player.h * scale;
        const px = player.x + (player.w - pw) / 2;
        const py = player.y + (player.h - ph) / 2;
        if (rectHit(px, py, pw, ph, o.x, o.y, o.w, o.h)) {
          onHit();
        }
      }

      // powerups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.x -= speed;
        p.y += Math.sin(frame * 0.1 + p.x * 0.02) * 0.6;
        if (p.x < -30) {
          powerups.splice(i, 1);
          continue;
        }
        // collect
        const dx = (player.x + player.w / 2) - p.x;
        const dy = (player.y + player.h / 2) - p.y;
        if (dx * dx + dy * dy < (p.r + 20) * (p.r + 20)) {
          activatePower(p);
          // collect particles
          for (let k = 0; k < 10; k++) {
            particles.push({
              x: p.x, y: p.y,
              vx: (Math.random() - 0.5) * 6,
              vy: (Math.random() - 0.5) * 6,
              life: 20 + Math.random() * 12,
              color: p.color
            });
          }
          powerups.splice(i, 1);
        }
      }
    }

    function activatePower(p) {
      if (p.id === "shield") shieldTimer = p.duration;
      else if (p.id === "slowmo") slowmoTimer = p.duration;
      else if (p.id === "extraJump") {
        extraJumpTimer = p.duration;
        canDoubleJump = true;
      }
      updatePowerStatus();
    }

    function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
      const m = 5;
      return ax + m < bx + bw && ax + aw - m > bx && ay + m < by + bh && ay + ah - m > by;
    }

    // ============================================================
    // PARTICLES & BACKGROUND
    // ============================================================
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.min(1, p.life / 18);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;
    }

    function drawBackground() {
      const lvl = LEVELS[currentLevel];
      const img = levelImages[currentLevel];

      // Fallback gradient
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, lvl.bg[0]);
      grad.addColorStop(1, lvl.bg[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw the building photo as background (covers most of the sky area)
      if (img && img.complete && img.naturalWidth > 0) {
        // Scale image to cover width, keep aspect, align bottom of image near ground
        const scale = Math.max(canvas.width / img.naturalWidth, (GROUND_Y + 20) / img.naturalHeight);
        const drawW = img.naturalWidth * scale;
        const drawH = img.naturalHeight * scale;
        // Slow parallax scroll
        const offsetX = -((bgOffset * 0.15) % drawW);
        ctx.drawImage(img, offsetX, GROUND_Y - drawH + 10, drawW, drawH);
        // Seamless second copy
        if (offsetX + drawW < canvas.width) {
          ctx.drawImage(img, offsetX + drawW, GROUND_Y - drawH + 10, drawW, drawH);
        }
        // Soft vignette so player & obstacles stay readable
        const overlay = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        overlay.addColorStop(0, "rgba(0,0,0,0.15)");
        overlay.addColorStop(0.7, "rgba(0,0,0,0.05)");
        overlay.addColorStop(1, "rgba(0,0,0,0.35)");
        ctx.fillStyle = overlay;
        ctx.fillRect(0, 0, canvas.width, GROUND_Y);
      }

      // Ground strip
      ctx.fillStyle = lvl.ground;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
      ctx.fillStyle = lvl.groundDetail;
      const sw = 40;
      for (let x = -((bgOffset * 1.5) % sw); x < canvas.width; x += sw * 2) {
        ctx.fillRect(x, GROUND_Y, sw, 6);
      }
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0, GROUND_Y, canvas.width, 3);
    }

    // ============================================================
    // MAIN LOOP
    // ============================================================
    function update() {
      if (gameState !== "playing") return;

      frame++;
      bgOffset += speed;

      // timers
      if (shieldTimer > 0) shieldTimer--;
      if (slowmoTimer > 0) slowmoTimer--;
      if (extraJumpTimer > 0) extraJumpTimer--;
      if (invulnTimer > 0) invulnTimer--;
      updatePowerStatus();

      updatePlayer();
      updateObstaclesAndPowerups();
      updateParticles();

      score += speed * 0.12 * (slowmoTimer > 0 ? 0.7 : 1);
      scoreEl.textContent = Math.floor(score) + " / " + LEVELS[currentLevel].target;

      if (score >= LEVELS[currentLevel].target) {
        levelComplete();
        return;
      }

      // draw
      drawBackground();
      obstacles.forEach(o => drawPixelObstacle(ctx, o));
      powerups.forEach(p => drawPowerup(p));

      // shield aura
      if (shieldTimer > 0) {
        ctx.strokeStyle = "rgba(96,165,250,0.7)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 32, 0, Math.PI * 2);
        ctx.stroke();
      }

      const ch = CHARACTERS[selectedChar];
      drawPixelPlayer(ctx, player.x, player.y, player.w, player.h, ch, player.runFrame, player.ducking, invulnTimer > 0, !player.grounded);
      drawParticles();

      requestAnimationFrame(update);
    }

    // ============================================================
    // INIT
    // ============================================================
    function resize() {
      const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      // Leave room for UI chrome on mobile
      const maxW = Math.min(800, vw - 8);
      const maxH = Math.min(400, vh * 0.72);
      const scaleW = maxW / 800;
      const scaleH = maxH / 400;
      const scale = Math.min(scaleW, scaleH);
      const w = Math.floor(800 * scale);
      const h = Math.floor(400 * scale);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      const container = document.getElementById("game-container");
      if (container) {
        container.style.width = w + "px";
        container.style.height = h + "px";
      }
    }
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 150));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resize);
    }
    resize();
    // Show login if no player info saved, otherwise go to menu
    if (playerInfo.name && playerInfo.email && playerInfo.mobile) {
      showMenu();
    } else {
      showLogin();
    }
  </script>
